Lint:
  stage: Test
  image: python:3.13
  allow_failure: true
  script:
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - pip install -i https://aquapi.aquaveo.com/aquaveo/dev/+simple/ flake8-aquaveo
    - xmsconan_gen --version 0.0.0 build.toml
    - flake8 _package

