"Conan Build - Windows":
  stage: Test
  image: GLR-UV
  parallel:
    matrix:
      - PYTHON_TARGET_VERSION: '3.13'
  variables:
    AQUAPI_URL: "https://aquapi.aquaveo.com/aquaveo/dev"
    BUILD_MATRIX_FILTER: '{"options":{}}'
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        BUILD_MATRIX_FILTER: '{"options":{"testing":false}}'
    - when: on_success
  artifacts:
    expire_in: '1d'
    when: always
    paths:
      - .export
      - test_artifacts/
      - wheelhouse/*.whl
  script:
    - export CTEST_PARALLEL_LEVEL=${CTEST_PARALLEL_LEVEL:-8}
    - export UV_PYTHON=${PYTHON_TARGET_VERSION}
    - uv --version
    - uv venv --python ${PYTHON_TARGET_VERSION} .venv
    - source .venv/Scripts/activate
    - python --version
    - uv pip install --upgrade "xmsconan[ci]>=2.18.0,<3" --index-url https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - cmake --version
    - xmsconan_conan_setup
    - xmsconan_gen build.toml
    - python build.py --filter "${BUILD_MATRIX_FILTER}" --wheel-dir wheelhouse --skip-dependency-libs --artifacts-dir test_artifacts
    - xmsconan_conan_deploy xmssnap --save .export/xmssnap-windows-py${PYTHON_TARGET_VERSION}-{version}.tar.gz --package-query compiler.version=194
  tags:
    - WinVM

Lint:
  stage: Test
  image: python:3.13
  allow_failure: true
  script:
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - pip install -i https://aquapi.aquaveo.com/aquaveo/dev/+simple/ flake8-aquaveo
    - xmsconan_gen --version 0.0.0 build.toml
    - flake8 _package

Repair Wheel:
  stage: Package
  image: registry.aquaveo.com/xms/custom-builder:latest
  only:
    - tags
  needs:
    - job: "Python Build - py3.10"
      artifacts: true
      optional: true
    - job: "Python Instrumented Build - py3.13"
      artifacts: true
      optional: true
    - job: "Python Build - py3.13"
      artifacts: true
      optional: true
  script:
    - /opt/python/cp313-cp313/bin/pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - /opt/python/cp313-cp313/bin/xmsconan_wheel_repair --wheel-dir wheelhouse
  artifacts:
    expire_in: '1d'
    paths:
      - wheelhouse/

"Wheel Deploy":
  stage: Deploy
  image: python:3.13
  dependencies:
    - Repair Wheel
  script:
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_wheel_deploy --wheel-dir wheelhouse
  only:
    - tags

"Conan Deploy - Linux":
  stage: Deploy
  image: ubuntu:latest
  dependencies:
    - "Python Build - py3.10"
    - "Python Build - py3.13"
  script:
    - apt-get update
    - apt-get install -y python3-pip python3-venv
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_conan_setup
    - xmsconan_conan_deploy xmssnap --restore .export/xmssnap-linux-Release-pybind-py3.10-{version}.tar.gz
    - xmsconan_conan_deploy xmssnap --restore .export/xmssnap-linux-Release-pybind-py3.13-{version}.tar.gz
    - xmsconan_conan_deploy xmssnap --upload
  only:
    - tags

"Wheel Deploy - Windows":
  stage: Deploy
  image: python:3.13
  needs:
    - job: "Conan Build - Windows"
      artifacts: true
  script:
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_wheel_deploy --wheel-dir wheelhouse
  only:
    - tags

"Conan Deploy - Windows":
  stage: Deploy
  # GLR-UV and `uv venv`, for the reasons spelled out on "Conan Build -
  # Windows" above. This job only restores and uploads a cache tarball, so it
  # does not compile against the interpreter -- it still builds the venv on
  # the matrix ABI so both Windows jobs bootstrap identically and neither can
  # be the one that rots.
  image: GLR-UV
  parallel:
    matrix:
      - PYTHON_TARGET_VERSION: '3.13'
  # Depend on the whole build job rather than selecting one parallel instance.
  # GitLab does not expand variables inside needs:parallel:matrix, so a selector
  # like "PYTHON_TARGET_VERSION: $PYTHON_TARGET_VERSION" is compared literally,
  # matches no job, and fails the whole pipeline at config time with
  # "undefined need". Listing the matrix values instead would make every deploy
  # instance need every build instance anyway, so this is equivalent and cannot
  # drift out of sync with the matrix above.
  needs:
    - job: "Conan Build - Windows"
      artifacts: true
  artifacts:
    expire_in: '1d'
    paths:
      - conan_packages/
  script:
    - uv --version
    - uv venv --python ${PYTHON_TARGET_VERSION} .venv
    - source .venv/Scripts/activate
    - uv pip install --upgrade "xmsconan[ci]>=2.18.0,<3" --index-url https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_conan_setup
    - xmsconan_conan_deploy xmssnap --restore .export/xmssnap-windows-py${PYTHON_TARGET_VERSION}-{version}.tar.gz --upload --package-query compiler.version=194
    - mkdir -p conan_packages
    - cp -r ${HOME}/.conan2/p/* conan_packages/ || echo "warning - no Conan packages under ${HOME}/.conan2/p, conan_packages/ artifact will be empty"
  only:
    - tags
  tags:
    - WinVM


Coverage:
  stage: Coverage
  needs:
    - job: "Python Instrumented Build - py3.13"
      artifacts: true
    - job: "Debug Instrumented Build"
      artifacts: true
  except:
    - tags
  image: python:3.13
  script:
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_coverage --phase report build.toml
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cov-cpp.xml
    paths:
      - cov-cpp.xml
      - cov-cpp-summary.json
      - cov-py.xml
      - cov-py-summary.json
      - coverage-html-cpp/
      - coverage-html-py/
  coverage: '/Coverage total: (\d+\.?\d*%)/'

pages:
  stage: Pages
  dependencies:
    - "Coverage"
  script:
    - mkdir -p public
    - cp -r coverage-html-cpp public/cpp
    - HAS_PY=0
    - if [ -d coverage-html-py ]; then cp -r coverage-html-py public/python; HAS_PY=1; fi
    - |
      {
        echo '<!DOCTYPE html>'
        echo '<html lang="en"><head><meta charset="utf-8">'
        echo '<title>xmssnap coverage</title></head><body>'
        echo '<h1>xmssnap coverage</h1>'
        echo '<ul>'
        echo '<li><a href="cpp/index.html">C++ coverage (gcovr)</a></li>'
        [ "$HAS_PY" -eq 1 ] && echo '<li><a href="python/index.html">Python coverage (pytest-cov)</a></li>'
        echo '</ul></body></html>'
      } > public/index.html
  artifacts:
    paths:
      - public
  only:
    - master
    - main
