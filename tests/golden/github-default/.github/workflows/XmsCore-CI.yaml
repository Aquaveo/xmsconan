# Required repository secrets:
#   CONAN2_USER_SECRET     - Conan remote login username
#   CONAN2_PASSWORD_SECRET - Conan remote login password
#   AQUAPI_USERNAME_SECRET - devpi username for wheel uploads
#   AQUAPI_PASSWORD_SECRET - devpi password for wheel uploads
#   AQUAVEO_GITHUB_TOKEN   - GitHub token for release asset uploads
# Optional repository variable (Settings > Secrets and variables > Variables):
#   AQUAPI_URL_DEV         - devpi index URL for wheel uploads; defaults to the
#                            public dev index. A variable, not a secret: the
#                            URL is public, and masking it only turns the
#                            upload target into `***` in the log.
#
# Each secret is set on the steps that use it, never on the job. Job-level
# env is inherited by every step, including the one that runs the library's
# own test suite inside `conan create` and the pinned third-party actions;
# none of those has a use for a deploy credential.
#
# Third-party actions are pinned to a commit SHA with the tag in a trailing
# comment. A tag is a movable ref in someone else's repository: whoever owns
# it can retarget it at new code, which then runs here on a runner that has
# already logged in to Conan and can write GITHUB_ENV for every later step.
# Update a pin by resolving the new tag
# (`gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`) and editing the
# template -- not the generated file.
#
# Every job installs `xmsconan[ci]` from the public Aquaveo index -- the
# extra pins conan, cmake, gcovr and the flake8 plugins in xmsconan's own
# pyproject.toml -- and the tools read the package version from
# GITHUB_REF_NAME themselves when GITHUB_REF_TYPE is `tag` (0.0.0
# otherwise), so no step exports a version for the next one and no action
# is needed to find the tag. See docs/USAGE.md §10.3.
#
# Generated by xmsconan_ci — do not edit manually.
#
# GitHub runs the C++ tests inside the build job rather than in a separate
# downstream job, so [ci].test_shards reaches build.py directly. The
# packager then skips cmake.test() during the build and runs the suite
# afterward as N in-process gtest shards on the same runner -- the GitLab
# job does the same thing, just from downloaded artifacts.

name: XmsCore-CI

on:
  push:
  pull_request:

jobs:
  # ----------------------------------------------------------------------------------------------
  # FLAKE
  # ----------------------------------------------------------------------------------------------
  flake:
    name: Flake Project
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        python-version: ['3.13']

    steps:
      # Checkout Sources
      - name: Checkout Source
        uses: actions/checkout@v4
      # Setup Python
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install Python Dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # The plugins the generated .flake8 relies on ride in on the [ci]
          # extra; xmsconan's pyproject.toml says which, and why each one.
          pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
      # Generate .flake8 so CI lints with the same config developers use locally.
      # Do not inline the flake8 settings here: that duplicates .flake8.jinja and
      # the two copies drift apart silently.
      - name: Generate Build Files
        run: xmsconan_gen build.toml
      # Flake Code
      - name: Run Flake
        run: flake8 _package

  # ----------------------------------------------------------------------------------------------
  # MAC
  # ----------------------------------------------------------------------------------------------
  mac:
    name: Clang-Latest (${{ matrix.build_type }}, ${{ matrix.python-version }}, Macos)
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15]
        python-version: ["3.13"]
        build_type: ["Release", "Debug"]

    env:
      MATRIX_NAME: ${{ matrix.platform }}-Clang${{ matrix.compiler-version }}-${{ matrix.build_type }}
      # Library Variables
      LIBRARY_NAME: xmscore
      # Conan Variables
      CONAN_REMOTE_URL: https://conan2.aquaveo.com/artifactory/api/conan/aquaveo-stable
      # Python Variables
      PYTHON_TARGET_VERSION: ${{ matrix.python-version }}
      CTEST_PARALLEL_LEVEL: '8'

    steps:
      # Get Correct Version of Xcode
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1
        with:
          xcode-version: 16.4
      - name: Setup Clang
        run: |
          clang --version
      # Checkout Sources
      - name: Checkout Source
        uses: actions/checkout@v4
      # Setup Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install Python Dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
      # Setup Conan
      - name: Setup Conan
        run: xmsconan_conan_setup --remote-url ${{ env.CONAN_REMOTE_URL }} --login --remove-conancenter
        shell: bash
        env:
          CONAN_LOGIN_USERNAME: ${{ secrets.CONAN2_USER_SECRET }}
          CONAN_PASSWORD: ${{ secrets.CONAN2_PASSWORD_SECRET }}
      # Generate XMS Conan
      - name: Generate XMS Conan
        run: xmsconan_gen build.toml
      # Build the Conan Package
      - name: Build the Conan Packages
        run: "python build.py --filter=\"{\\\"build_type\\\": \\\"${{ matrix.build_type }}\\\"}\"${{ matrix.build_type == 'Release' && ' --wheel-dir wheelhouse' || '' }} --artifacts-dir test_artifacts"
        shell: bash
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ env.MATRIX_NAME }}
          path: test_artifacts/
          if-no-files-found: ignore
        if: always()
      # Repair wheel (Release only)
      - name: Repair wheel
        run: xmsconan_wheel_repair --wheel-dir wheelhouse --platform macos
        shell: bash
        if: matrix.build_type == 'Release'
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}
          path: wheelhouse/*.whl
        if: matrix.build_type == 'Release'
      # Upload wheel to Aquapi
      - name: Upload wheel to Aquapi
        run: xmsconan_wheel_deploy --wheel-dir wheelhouse
        shell: bash
        env:
          AQUAPI_USERNAME: ${{ secrets.AQUAPI_USERNAME_SECRET }}
          AQUAPI_PASSWORD: ${{ secrets.AQUAPI_PASSWORD_SECRET }}
          AQUAPI_URL: ${{ vars.AQUAPI_URL_DEV || 'https://public.aquapi.aquaveo.com/aquaveo/dev/' }}
        if: startsWith(github.ref, 'refs/tags/') && matrix.build_type == 'Release'
      # Upload Release to Conan
      - name: Upload Releases to Conan
        run: "python build.py --skip-build --upload --filter=\"{\\\"build_type\\\": \\\"${{ matrix.build_type }}\\\"}\""
        shell: bash
        # The login Setup Conan persisted normally carries the upload; the
        # credentials stay on this step until a tag pipeline shows it does.
        env:
          CONAN_LOGIN_USERNAME: ${{ secrets.CONAN2_USER_SECRET }}
          CONAN_PASSWORD: ${{ secrets.CONAN2_PASSWORD_SECRET }}
        if: startsWith(github.ref, 'refs/tags/')
      # Get the Release Data
      - name: Get Release
        id: git_release
        uses: bruceadams/get-release@74c3d60f5a28f358ccf241a00c9021ea16f0569f  # v1.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.AQUAVEO_GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')
      - name: Archive Conan Packages
        run: xmsconan_conan_deploy xmscore --save ${{ env.MATRIX_NAME }}.tar.gz
        shell: bash
        if: startsWith(github.ref, 'refs/tags/')
      # Upload Zipped Conan Packages
      - name: Upload Zipped Conan Packages
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.AQUAVEO_GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.git_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/${{ env.MATRIX_NAME }}.tar.gz
          asset_name: ${{ env.MATRIX_NAME }}.tar.gz
          asset_content_type: application/zip
        if: startsWith(github.ref, 'refs/tags/')

  # ----------------------------------------------------------------------------------------------
  # LINUX
  # ----------------------------------------------------------------------------------------------
  linux:
    name: GCC-13 (${{ matrix.build_type }}, Linux)
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/aquaveo/conan-gcc13-py${{ matrix.python-version }}:latest

    strategy:
      fail-fast: false
      matrix:
        build_type: ["Release", "Debug"]
        python-version: ["3.13"]

    env:
      MATRIX_NAME: linux-GCC13-${{ matrix.build_type }}
      # Library Variables
      LIBRARY_NAME: xmscore
      # Conan Variables
      CONAN_REMOTE_URL: https://conan2.aquaveo.com/artifactory/api/conan/aquaveo-stable
      # Python Variables
      PYTHON_TARGET_VERSION: ${{ matrix.python-version }}
      CTEST_PARALLEL_LEVEL: '8'

    steps:
      # Checkout Sources
      - name: Checkout Source
        uses: actions/checkout@v4
      # Install Python Dependencies
      - name: Install Python Dependencies
        run: |
          pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
      # Setup Conan
      - name: Setup Conan
        run: xmsconan_conan_setup --remote-url ${{ env.CONAN_REMOTE_URL }} --login
        shell: bash
        env:
          CONAN_LOGIN_USERNAME: ${{ secrets.CONAN2_USER_SECRET }}
          CONAN_PASSWORD: ${{ secrets.CONAN2_PASSWORD_SECRET }}
      # Generate XMS Conan
      - name: Generate XMS Conan
        run: xmsconan_gen build.toml
      # Build the Conan Package
      - name: Build the Conan Packages
        run: "python build.py --filter=\"{\\\"build_type\\\": \\\"${{ matrix.build_type }}\\\"}\"${{ matrix.build_type == 'Release' && ' --wheel-dir wheelhouse' || '' }} --artifacts-dir test_artifacts"
        shell: bash
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ env.MATRIX_NAME }}
          path: test_artifacts/
          if-no-files-found: ignore
        if: always()
      # Repair wheel (Release only)
      - name: Repair wheel
        run: xmsconan_wheel_repair --wheel-dir wheelhouse --platform linux
        shell: bash
        if: matrix.build_type == 'Release'
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}
          path: wheelhouse/*.whl
        if: matrix.build_type == 'Release'
      # Upload wheel to Aquapi
      - name: Upload wheel to Aquapi
        run: xmsconan_wheel_deploy --wheel-dir wheelhouse
        shell: bash
        env:
          AQUAPI_USERNAME: ${{ secrets.AQUAPI_USERNAME_SECRET }}
          AQUAPI_PASSWORD: ${{ secrets.AQUAPI_PASSWORD_SECRET }}
          AQUAPI_URL: ${{ vars.AQUAPI_URL_DEV || 'https://public.aquapi.aquaveo.com/aquaveo/dev/' }}
        if: startsWith(github.ref, 'refs/tags/') && matrix.build_type == 'Release'
      # Upload Release to Conan
      - name: Upload Releases to Conan
        run: "python build.py --skip-build --upload --filter=\"{\\\"build_type\\\": \\\"${{ matrix.build_type }}\\\"}\""
        shell: bash
        # The login Setup Conan persisted normally carries the upload; the
        # credentials stay on this step until a tag pipeline shows it does.
        env:
          CONAN_LOGIN_USERNAME: ${{ secrets.CONAN2_USER_SECRET }}
          CONAN_PASSWORD: ${{ secrets.CONAN2_PASSWORD_SECRET }}
        if: startsWith(github.ref, 'refs/tags/')
      # Get the Release Data
      - name: Get Release
        id: git_release
        uses: bruceadams/get-release@74c3d60f5a28f358ccf241a00c9021ea16f0569f  # v1.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.AQUAVEO_GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')
      - name: Archive Conan Packages
        run: xmsconan_conan_deploy xmscore --save ${{ env.MATRIX_NAME }}.tar.gz
        shell: bash
        if: startsWith(github.ref, 'refs/tags/')
      # Upload Zipped Conan Packages
      - name: Upload Zipped Conan Packages
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.AQUAVEO_GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.git_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/${{ env.MATRIX_NAME }}.tar.gz
          asset_name: ${{ env.MATRIX_NAME }}.tar.gz
          asset_content_type: application/zip
        if: startsWith(github.ref, 'refs/tags/')

  # ----------------------------------------------------------------------------------------------
  # WINDOWS
  # ----------------------------------------------------------------------------------------------
  windows:
    name: Visual Studio ${{ matrix.compiler-version }} (${{ matrix.build_type }}, ${{ matrix.python-version }}, Windows)
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [windows-2022]
        python-version: ["3.13"]
        compiler-version: [17]
        build_type: ["Release", "Debug"]

    env:
      MATRIX_NAME: ${{ matrix.platform }}-VS${{ matrix.compiler-version }}-${{ matrix.build_type }}-py${{ matrix.python-version }}
      # Library Variables
      LIBRARY_NAME: xmscore
      # Conan Variables
      CONAN_REMOTE_URL: https://conan2.aquaveo.com/artifactory/api/conan/aquaveo-stable
      # Python Variables
      PYTHON_TARGET_VERSION: ${{ matrix.python-version }}
      CTEST_PARALLEL_LEVEL: '8'

    steps:
      # Checkout Sources
      - name: Checkout Source
        uses: actions/checkout@v4
      # Setup Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Setup Dev Command Prompt env for MSVC
      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64
      # Install Python Dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
      # Setup Visual Studio
      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce  # v2
      # Setup Conan
      - name: Setup Conan
        run: xmsconan_conan_setup --remote-url ${{ env.CONAN_REMOTE_URL }} --login
        shell: cmd
        env:
          CONAN_LOGIN_USERNAME: ${{ secrets.CONAN2_USER_SECRET }}
          CONAN_PASSWORD: ${{ secrets.CONAN2_PASSWORD_SECRET }}
      # Generate XMS Conan
      - name: Generate XMS Conan
        run: xmsconan_gen build.toml
      # Build the Conan Package
      - name: Build the Conan Packages
        run: "python build.py --filter=\"{\\\"build_type\\\": \\\"${{ matrix.build_type }}\\\"}\"${{ matrix.build_type == 'Release' && ' --wheel-dir wheelhouse' || '' }} --artifacts-dir test_artifacts"
        shell: cmd
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ env.MATRIX_NAME }}
          path: test_artifacts/
          if-no-files-found: ignore
        if: always()
      # Repair wheel (Release only)
      - name: Repair wheel
        run: xmsconan_wheel_repair --wheel-dir wheelhouse --platform windows
        shell: bash
        if: matrix.build_type == 'Release'
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}-py${{ matrix.python-version }}
          path: wheelhouse/*.whl
        if: matrix.build_type == 'Release'
      # Upload wheel to Aquapi
      - name: Upload wheel to Aquapi
        run: xmsconan_wheel_deploy --wheel-dir wheelhouse
        shell: bash
        env:
          AQUAPI_USERNAME: ${{ secrets.AQUAPI_USERNAME_SECRET }}
          AQUAPI_PASSWORD: ${{ secrets.AQUAPI_PASSWORD_SECRET }}
          AQUAPI_URL: ${{ vars.AQUAPI_URL_DEV || 'https://public.aquapi.aquaveo.com/aquaveo/dev/' }}
        if: startsWith(github.ref, 'refs/tags/') && matrix.build_type == 'Release'
      # Upload Release to Conan
      - name: Upload Releases to Conan
        run: "python build.py --skip-build --upload --filter=\"{\\\"build_type\\\": \\\"${{ matrix.build_type }}\\\"}\""
        shell: cmd
        # The login Setup Conan persisted normally carries the upload; the
        # credentials stay on this step until a tag pipeline shows it does.
        env:
          CONAN_LOGIN_USERNAME: ${{ secrets.CONAN2_USER_SECRET }}
          CONAN_PASSWORD: ${{ secrets.CONAN2_PASSWORD_SECRET }}
        if: startsWith(github.ref, 'refs/tags/')
      # Get the Release Data
      - name: Get Release
        id: git_release
        uses: bruceadams/get-release@74c3d60f5a28f358ccf241a00c9021ea16f0569f  # v1.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.AQUAVEO_GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')
      - name: Archive Conan Packages
        run: xmsconan_conan_deploy xmscore --save ${{ env.MATRIX_NAME }}.tar.gz
        shell: cmd
        if: startsWith(github.ref, 'refs/tags/')
      # Upload Zipped Conan Packages
      - name: Upload Zipped Conan Packages
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.AQUAVEO_GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.git_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/${{ env.MATRIX_NAME }}.tar.gz
          asset_name: ${{ env.MATRIX_NAME }}.tar.gz
          asset_content_type: application/zip
        if: startsWith(github.ref, 'refs/tags/')
