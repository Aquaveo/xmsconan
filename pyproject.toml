[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmsconan"
dynamic = ["version"]
description = "Methods and Modules used to aid in xmsconan projects"
authors = [
    {name = "Gage Larsen"}
]
license = "BSD-2-Clause"
readme = "README.md"
# The floor is the lowest entry of xmsconan.constants.SUPPORTED_PYTHON_VERSIONS,
# not the highest: the generated Windows CI matrix runs a leg per supported
# version and each one pip-installs xmsconan, so a floor above 3.10 makes those
# legs uninstallable. The code itself needs >=3.9 for runtime PEP 585 generics
# (`list[dict]` in generator_tools/build_file_generator.py and
# coverage_tools/coverage_generator.py, with no `from __future__ import
# annotations` anywhere).
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "conan>=2",
    # Kept for one release, for `xmsconan wheel-deploy --client devpi`.
    "devpi-client",
    "jinja2",
    "setuptools-scm",
    "tabulate",
    # The TOML parser. tomllib is standard from 3.11; tomli is the same API
    # for the one older interpreter still supported. xmsconan/_tomllib.py
    # picks between them, and nothing else imports either directly.
    'tomli; python_version < "3.11"',
    # `xmsconan wheel-deploy` uploads with `uv publish`, running the binary
    # this package installs (uv.find_uv_bin()). Listing it here puts that
    # binary in every environment that installs xmsconan -- including the
    # generated Wheel Deploy jobs, which install nothing else -- so the switch
    # needs no consumer regeneration. `uv publish` arrived in the 0.4 series;
    # 0.5 is the floor.
    #
    # Those jobs install with `-i` (index-url, not extra-index-url), so this
    # dependency has to resolve from the Aquaveo index rather than PyPI --
    # and uv ships as platform-specific wheels, so mirroring the project is
    # not enough on its own. Checked:
    # https://public.aquapi.aquaveo.com/aquaveo/dev/+simple/uv/ answers 200 and
    # lists manylinux_2_17_x86_64 and win_amd64 wheels, which are the two the
    # generated deploy jobs need. Re-check that page, not just the project's
    # existence, before raising this floor.
    "uv>=0.5",
]

[project.scripts]
xmsconan = "xmsconan.cli:main"
xmsconan_gen = "xmsconan.generator_tools.build_file_generator:main"
xmsconan_ci = "xmsconan.generator_tools.ci_file_generator:main"
xmsconan_profiles = "xmsconan.generator_tools.profile_generator:main"
xmsconan_coverage = "xmsconan.coverage_tools.coverage_generator:main"
xmsconan_build = "xmsconan.build_tools.build_library:main"
xmsconan_vs2019 = "xmsconan.build_tools.vs2019_build:main"
xmsconan_conan_setup = "xmsconan.ci_tools.conan_setup:main"
xmsconan_wheel_repair = "xmsconan.ci_tools.wheel_repair:main"
xmsconan_wheel_deploy = "xmsconan.ci_tools.wheel_deploy:main"
xmsconan_conan_deploy = "xmsconan.ci_tools.conan_deploy:main"
xmsconan_test_shards = "xmsconan.ci_tools.test_shards:main"
xmsconan_publish = "xmsconan.ci_tools.publish:main"

[project.optional-dependencies]
test = ["pytest", "pyyaml"]
# What a generated CI job installs, as one line: `pip install "xmsconan[ci]"`.
# The templates used to pin these by hand on some fifteen install lines
# across the two hosts, so a bump had to land on every one of them; it is
# now one edit here. The jobs install with `-i` (index-url, not
# extra-index-url), so every entry, and everything it pulls in, has to
# resolve from the public Aquaveo index alone, on every platform a job runs
# on -- see the `uv` note above for what checking that means.
# Checked 2026-09-05 with `uv pip install --dry-run` against that index
# alone, for manylinux x86_64 and aarch64, win_amd64 and macOS arm64 on
# 3.10, 3.13 and 3.14: every combination resolves. cmake is the one entry
# that ships per-platform wheels; +simple/cmake/ lists macosx universal2,
# manylinux aarch64 and x86_64, and win_amd64. The rest are pure Python.
ci = [
    # Pinned to a patch series on purpose: a conan minor bump can change
    # package_id computation and silently detach builds from the binaries
    # already published to the remote. Bump this deliberately.
    "conan~=2.31.0",
    # The GitLab Windows runners carry no cmake, so the build jobs already
    # took this wheel; it now goes to every job, and on the Linux images and
    # the GitHub runners it sits ahead of the system cmake on PATH.
    "cmake>=3.21",
    "gcovr>=7,<9",
    # The plugins the generated .flake8 relies on. flake8-tidy-imports
    # registers `banned-modules`, which that file sets: flake8 ignores a
    # config option no installed plugin claims, so without the plugin the
    # osgeo ban was accepted and enforced nothing.
    "flake8",
    "flake8-bugbear",
    "flake8-docstrings",
    "flake8-import-order",
    "flake8-tidy-imports",
    "pep8-naming",
]

[dependency-groups]
# Everything a contributor -- and xmsconan's own CI -- needs beyond the
# runtime dependencies: `uv sync --group dev`. The `test` extra above stays
# for consumers that pip-install it; this group is the superset that also
# carries the linter, the coverage plugin, and pre-commit. It restates the
# extra's two entries instead of listing `xmsconan[test]`: a self-reference
# makes `uv sync --only-group dev` build and install the package with its
# runtime dependencies, which is exactly what the lint job's --only-group
# exists to avoid. `tomli` is here unconditionally so the < 3.11 fallback in
# xmsconan/_tomllib.py can be exercised on every interpreter, not only the
# 3.10 CI leg.
dev = [
    "flake8",
    "flake8-bugbear",
    "flake8-docstrings",
    "flake8-import-order",
    "pep8-naming",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pyyaml",
    "tomli",
]

[project.urls]
Homepage = "https://github.com/Aquaveo/xmsconan"
Repository = "https://github.com/Aquaveo/xmsconan"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["xmsconan*"]

[tool.setuptools.package-data]
"xmsconan.generator_tools" = ["templates/**/*", "ci_templates/**/*"]
"xmsconan.build_tools" = ["profiles/**/*"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.coverage.report]
# The coverage floor for the whole package. pytest-cov reads it when
# `--cov-fail-under` is not on the command line, so CI, the README, and a
# local `uv run pytest tests/ --cov=xmsconan` all enforce this one number.
# Lowering it needs a reason in the PR; raising it is free once the tree
# clears the new bar.
fail_under = 90

[tool.pytest.ini_options]
# Bare `pytest` collects tests/ and nothing else. Without this it also walks
# the package, and every generated CI fixture or scratch tree left under the
# working copy, so what a bare run means depends on what is lying around --
# which is the one thing a gate command must not depend on.
testpaths = ["tests"]
markers = [
    "integration: end-to-end test that drives real conan + gcovr against a stub recipe. Opt-in via `pytest -m integration`; excluded from the default `pytest` run because it spins up a full coverage build (downloads boost/zlib/pybind11 from the Aquaveo remote when configured, compiles the stub library, runs pytest-cov + gcovr — multi-minute wall time).",
]
