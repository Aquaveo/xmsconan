# Required CI/CD variables:
#   CONAN_LOGIN_USERNAME - Conan remote login username
#   CONAN_PASSWORD       - Conan remote login password
#   AQUAPI_URL           - devpi index URL for wheel uploads
#   AQUAPI_USERNAME      - devpi username for wheel uploads
#   AQUAPI_PASSWORD      - devpi password for wheel uploads
#
# The Conan pair is listed unconditionally: no job here sets it, Conan reads
# it from the environment itself, and every build needs the remote -- not just
# the tag-time deploy. See docs/USAGE.md §10.2.
#
# Every job installs `xmsconan[ci]` from the public Aquaveo index -- the
# extra pins conan, cmake, gcovr and the flake8 plugins in xmsconan's own
# pyproject.toml -- and the tools read the package version from
# CI_COMMIT_TAG themselves (0.0.0 on an untagged pipeline), so no job
# exports a version for the next command. See docs/USAGE.md §10.3.
#
# Generated by xmsconan_ci — do not edit manually.

stages:
  - Build
  - Test
  - Package
  - Deploy
  - Coverage
  - Pages

Conan Build:
  stage: Build
  image: docker.aquaveo.com/aquaveo/conan-docker/conan-gcc13-x11-gdal-py3.13
  variables:
    PYTHON_TARGET_VERSION: '3.13'
  artifacts:
    expire_in: '1d'
    when: always
    paths:
      - .export
      - wheelhouse/
      - test_artifacts/
  script:
    - gcc --version
    - python --version
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - cmake --version
    - xmsconan_conan_setup
    - export CTEST_PARALLEL_LEVEL=${CTEST_PARALLEL_LEVEL:-8}
    - export XMS_SKIP_CXX_TESTS=1
    - xmsconan_gen build.toml
    - xvfb-run -a -s "-screen 0 1280x1024x24" python build.py --wheel-dir wheelhouse --artifacts-dir test_artifacts
    - xmsconan_conan_deploy xmssnap --save .export/xmssnap-linux-{version}.tar.gz

"Run C++ Tests - Release-testing":
  stage: Test
  image: docker.aquaveo.com/aquaveo/conan-docker/conan-gcc13-x11-gdal-py3.13
  except:
    - tags
  needs:
    - job: "Conan Build"
      artifacts: true
  artifacts:
    expire_in: '1d'
    when: always
    reports:
      junit: TEST-cxxtest.xml
    paths:
      - test_artifacts/Release-testing/
      - TEST-cxxtest.xml
  script:
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_test_shards --artifacts-dir test_artifacts --label Release-testing --shards 4 --xvfb
"Run C++ Tests - Debug-testing":
  stage: Test
  image: docker.aquaveo.com/aquaveo/conan-docker/conan-gcc13-x11-gdal-py3.13
  except:
    - tags
  needs:
    - job: "Conan Build"
      artifacts: true
  artifacts:
    expire_in: '1d'
    when: always
    reports:
      junit: TEST-cxxtest.xml
    paths:
