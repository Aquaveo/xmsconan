name: xmsconan

on: [push, pull_request]

jobs:
  flake:
    name: Flake Project
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        python-version: ["3.13"]

    steps:
      # Checkout Sources
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Setup Python
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Setup uv
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
      # Install the `dev` dependency group from pyproject.toml -- flake8 and
      # its plugins, pytest, pytest-cov -- so CI and `uv sync --group dev` on a
      # developer machine install the same tools from the same declaration.
      - name: Install Python Dependencies
        run: |
          uv sync --group dev --python ${{ matrix.python-version }}
      # Flake Code
      - name: Run Flake
        run: |
          uv run flake8 .

  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
        # Mirrors xmsconan.constants.SUPPORTED_PYTHON_VERSIONS. The 3.10 leg is
        # the one that runs the tomli fallback in xmsconan/_tomllib.py for real.
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      # Checkout Sources
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Setup Python
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Setup uv
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
      # Install Python Dependencies (editable xmsconan + the `dev` group)
      - name: Install Python Dependencies
        run: |
          uv sync --group dev --python ${{ matrix.python-version }}
      # Run Unit Tests
      # --cov-fail-under is the coverage floor for the whole package. Lowering
      # it needs a reason in the PR; raising it is free once the tree clears
      # the new bar.
      - name: Run Unit Tests
        run: |
          uv run pytest tests/ -v --cov=xmsconan --cov-report=term-missing:skip-covered --cov-fail-under=90

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [flake, unit-tests]
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        python-version: ["3.13"]

    steps:
      # Checkout Sources
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Setup Python
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install Python Dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools setuptools-scm devpi
          pip install .
      # Get Tag Name
      - name: Get Tag
        id: gitTag
        uses: little-core-labs/get-git-tag@2c292ff564c1a61b989e29f0410d131317f89b03  # v3.0.2
      # Check Tag
      - name: Check Tag Against Version
        run: |
          python -c "from xmsconan import __version__; print('Version: ' + str(__version__) + ' | Tag: ${{ steps.gitTag.outputs.tag }}')"
          python -c "from xmsconan import __version__; exit(0 if __version__ == '${{ steps.gitTag.outputs.tag }}' else 1)"
      # Build Wheel
      - name: Build Wheel and Upload
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          devpi use https://public.aquapi.aquaveo.com/aquaveo/dev/
          devpi login ${{ secrets.AQUAPI_USERNAME_SECRET }} --password ${{ secrets.AQUAPI_PASSWORD_SECRET }}
          devpi upload --from-dir dist
