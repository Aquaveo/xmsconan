# Runs flake8 -- the authoritative linter, with the same plugins the `dev`
# dependency group and xmsconan's own CI install -- on the staged files at
# every commit. One-time setup after `uv sync --group dev`:
#
#     uv run pre-commit install
#
# `uv run pre-commit run --all-files` lints the whole tree, which is what CI
# enforces. Configuration lives in .flake8; this file only wires the hook.
repos:
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear
          - flake8-docstrings
          - flake8-import-order
          - pep8-naming
