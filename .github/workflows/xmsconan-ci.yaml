name: xmsconan

on: [push, pull_request]

jobs:
  flake:
    name: Flake Project
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        python-version: ["3.13"]

    steps:
      # Checkout Sources
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Setup Python
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Setup uv. Third-party actions are pinned by commit SHA with the tag
      # in a trailing comment; GitHub's own actions (checkout, setup-python)
      # stay on major tags until plan item 7.1 pins every action.
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      # Install only the `dev` dependency group from pyproject.toml -- the
      # same flake8 and plugins `uv sync --group dev` gives a developer.
      # flake8 never imports the package (.flake8 classifies xmsconan by
      # name), so --only-group keeps the runtime dependencies out of this
      # job, and --no-sync below stops `uv run` from installing them anyway.
      - name: Install Python Dependencies
        run: |
          uv sync --only-group dev --python ${{ matrix.python-version }}
      # Flake Code
      - name: Run Flake
        run: |
          uv run --no-sync flake8 .

  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
        # Mirrors xmsconan.constants.SUPPORTED_PYTHON_VERSIONS. The 3.10 leg is
        # the one that runs the tomli fallback in xmsconan/_tomllib.py for real.
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      # Checkout Sources
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Setup Python
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Setup uv
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      # Install Python Dependencies (editable xmsconan + the `dev` group)
      - name: Install Python Dependencies
        run: |
          uv sync --group dev --python ${{ matrix.python-version }}
      # Run Unit Tests
      # The coverage floor is `fail_under` under [tool.coverage.report] in
      # pyproject.toml. pytest-cov applies it because no --cov-fail-under is
      # given here, so CI, the README, and a local run share one number.
      - name: Run Unit Tests
        run: |
          uv run pytest tests/ -v --cov=xmsconan --cov-report=term-missing:skip-covered

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [flake, unit-tests]
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        python-version: ["3.13"]

    steps:
      # Checkout Sources
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Setup Python
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Setup uv
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      # Install xmsconan and its runtime dependencies so the tag check below
      # can import its version. --no-dev: uv's default groups include `dev`,
      # and this job has no use for flake8, pytest, or pre-commit.
      - name: Install Python Dependencies
        run: |
          uv sync --no-dev --python ${{ matrix.python-version }}
      # Get Tag Name
      - name: Get Tag
        id: gitTag
        uses: little-core-labs/get-git-tag@2c292ff564c1a61b989e29f0410d131317f89b03  # v3.0.2
      # Check Tag
      #
      # The tag reaches python through the environment, not through the `-c`
      # string. A tag name is caller-supplied text, and GitHub substitutes
      # `${{ }}` before the shell parses the line -- so a tag carrying a quote
      # or `$(...)` would run as this step, in the job whose Upload Wheel step
      # holds the deploy credentials.
      - name: Check Tag Against Version
        env:
          GIT_TAG: ${{ steps.gitTag.outputs.tag }}
        run: |
          uv run --no-sync python -c "import os; from xmsconan import __version__; print('Version: ' + str(__version__) + ' | Tag: ' + os.environ['GIT_TAG'])"
          uv run --no-sync python -c "import os, sys; from xmsconan import __version__; sys.exit(0 if __version__ == os.environ['GIT_TAG'] else 1)"
      # Build Wheel
      - name: Build Wheel
        run: |
          uv build --wheel
      # Upload with `uv publish`. The credentials are scoped to this one step
      # and travel in its environment, so they are not visible to the steps
      # above and never appear on a command line -- where `devpi login
      # --password` used to put them for `ps` and process-creation auditing
      # to read.
      - name: Upload Wheel
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.AQUAPI_USERNAME_SECRET }}
          UV_PUBLISH_PASSWORD: ${{ secrets.AQUAPI_PASSWORD_SECRET }}
        run: |
          uv publish --publish-url https://public.aquapi.aquaveo.com/aquaveo/dev/ dist/*.whl
