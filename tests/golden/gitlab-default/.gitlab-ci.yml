# Required CI/CD variables:
#   CONAN_LOGIN_USERNAME - Conan remote login username
#   CONAN_PASSWORD       - Conan remote login password
#   AQUAPI_URL           - devpi index URL for wheel uploads
#   AQUAPI_USERNAME      - devpi username for wheel uploads
#   AQUAPI_PASSWORD      - devpi password for wheel uploads
#
# The Conan pair is listed unconditionally: no job here sets it, Conan reads
# it from the environment itself, and every build needs the remote -- not just
# the tag-time deploy. See docs/USAGE.md §10.2.
#
# Generated by xmsconan_ci — do not edit manually.

stages:
  - Test
  - Package
  - Deploy

variables:
  DEFAULT_VERSION: "0.0.0"
  PACKAGE_VERSION: "${CI_COMMIT_TAG:-$DEFAULT_VERSION}"

Conan Build:
  stage: Test
  image: docker.aquaveo.com/aquaveo/conan-docker/conan-gcc13-py3.13
  variables:
    PYTHON_TARGET_VERSION: '3.13'
  artifacts:
    expire_in: '1d'
    when: always
    paths:
      - .export
      - wheelhouse/
      - test_artifacts/
  script:
    - gcc --version
    - cmake --version
    - python --version
    - pip install "conan~=2.31.0" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - pip install --upgrade "xmsconan>=2.18.0" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_conan_setup
    - export PACKAGE_VERSION=${CI_COMMIT_TAG:-0.0.0}
    - export CTEST_PARALLEL_LEVEL=${CTEST_PARALLEL_LEVEL:-8}
    - xmsconan_gen --version ${PACKAGE_VERSION} build.toml
    - python build.py --version ${PACKAGE_VERSION} --wheel-dir wheelhouse --artifacts-dir test_artifacts
    - xmsconan_conan_deploy xmssnap ${PACKAGE_VERSION} --save .export/xmssnap-linux-${PACKAGE_VERSION}.tar.gz

"Conan Build - Windows":
  stage: Test
  image: GLR-UV
  parallel:
    matrix:
      - PYTHON_TARGET_VERSION: '3.13'
  variables:
    AQUAPI_URL: "https://aquapi.aquaveo.com/aquaveo/dev"
  artifacts:
    expire_in: '1d'
    when: always
    paths:
      - .export
      - test_artifacts/
      - wheelhouse/*.whl
  script:
    - export PACKAGE_VERSION=${CI_COMMIT_TAG:-0.0.0}
    - export CTEST_PARALLEL_LEVEL=${CTEST_PARALLEL_LEVEL:-8}
    - echo ${PACKAGE_VERSION}
    - export UV_PYTHON=${PYTHON_TARGET_VERSION}
    - uv --version
    - uv venv --python ${PYTHON_TARGET_VERSION} .venv
    - source .venv/Scripts/activate
    - python --version
    - uv pip install "conan~=2.31.0" "cmake>=3.21" packaging
    - uv pip install --upgrade "xmsconan>=2.18.0" --index-url https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - cmake --version
    - xmsconan_conan_setup
    - xmsconan_gen --version ${PACKAGE_VERSION} build.toml
    - python build.py --version ${PACKAGE_VERSION} --wheel-dir wheelhouse --skip-dependency-libs --artifacts-dir test_artifacts
    - xmsconan_conan_deploy xmssnap ${PACKAGE_VERSION} --save .export/xmssnap-windows-py${PYTHON_TARGET_VERSION}-${PACKAGE_VERSION}.tar.gz --package-query compiler.version=194
  tags:
    - WinVM

Lint:
  stage: Test
  image: python:3.13
  allow_failure: true
  script:
    - pip install flake8 flake8-docstrings flake8-bugbear flake8-import-order pep8-naming flake8-colors flake8-tidy-imports
    - pip install -i https://aquapi.aquaveo.com/aquaveo/dev/+simple/ flake8-aquaveo
    - pip install --upgrade "xmsconan>=2.18.0" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_gen --version 0.0.0 build.toml
    - flake8 _package

Repair Wheel:
  stage: Package
  image: quay.io/pypa/manylinux_2_28_x86_64
  dependencies:
    - Conan Build
  script:
    - /opt/python/cp313-cp313/bin/pip install --upgrade "xmsconan>=2.18.0" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - /opt/python/cp313-cp313/bin/xmsconan_wheel_repair --wheel-dir wheelhouse
  artifacts:
    expire_in: '1d'
    paths:
      - wheelhouse/

"Wheel Deploy":
  stage: Deploy
  image: python:3.13
  dependencies:
    - Repair Wheel
  script:
    - pip install --upgrade "xmsconan>=2.18.0" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_wheel_deploy --wheel-dir wheelhouse
  only:
    - tags

"Conan Deploy - Linux":
  stage: Deploy
  image: ubuntu:latest
  dependencies:
    - Conan Build
  script:
    - apt-get update
    - apt-get install -y python3-pip python3-venv
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install "conan~=2.31.0" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - pip install --upgrade "xmsconan>=2.18.0" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_conan_setup
    - export PACKAGE_VERSION=${CI_COMMIT_TAG:-0.0.0}
    - xmsconan_conan_deploy xmssnap ${PACKAGE_VERSION} --restore .export/xmssnap-linux-${PACKAGE_VERSION}.tar.gz --upload
  only:
    - tags

"Wheel Deploy - Windows":
  stage: Deploy
  image: python:3.13
  needs:
    - job: "Conan Build - Windows"
      artifacts: true
  script:
    - pip install --upgrade "xmsconan>=2.18.0" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_wheel_deploy --wheel-dir wheelhouse
  only:
    - tags

"Conan Deploy - Windows":
  stage: Deploy
  # GLR-UV and `uv venv`, for the reasons spelled out on "Conan Build -
  # Windows" above. This job only restores and uploads a cache tarball, so it
  # does not compile against the interpreter -- it still builds the venv on
  # the matrix ABI so both Windows jobs bootstrap identically and neither can
  # be the one that rots.
  image: GLR-UV
  parallel:
    matrix:
      - PYTHON_TARGET_VERSION: '3.13'
  # Depend on the whole build job rather than selecting one parallel instance.
  # GitLab does not expand variables inside needs:parallel:matrix, so a selector
  # like "PYTHON_TARGET_VERSION: $PYTHON_TARGET_VERSION" is compared literally,
  # matches no job, and fails the whole pipeline at config time with
  # "undefined need". Listing the matrix values instead would make every deploy
  # instance need every build instance anyway, so this is equivalent and cannot
  # drift out of sync with the matrix above.
  needs:
    - job: "Conan Build - Windows"
      artifacts: true
  artifacts:
    expire_in: '1d'
    paths:
      - conan_packages/
  script:
    - export PACKAGE_VERSION=${CI_COMMIT_TAG:-0.0.0}
    - uv --version
    - uv venv --python ${PYTHON_TARGET_VERSION} .venv
    - source .venv/Scripts/activate
    - uv pip install "conan~=2.31.0" --index-url https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - uv pip install --upgrade "xmsconan>=2.18.0" --index-url https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_conan_setup
    - xmsconan_conan_deploy xmssnap ${PACKAGE_VERSION} --restore .export/xmssnap-windows-py${PYTHON_TARGET_VERSION}-${PACKAGE_VERSION}.tar.gz --upload --package-query compiler.version=194
    - mkdir -p conan_packages
    - cp -r ${HOME}/.conan2/p/* conan_packages/ || echo "warning - no Conan packages under ${HOME}/.conan2/p, conan_packages/ artifact will be empty"
  only:
    - tags
  tags:
    - WinVM


