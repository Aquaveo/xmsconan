"Conan Deploy - Windows":
  stage: Deploy
  # GLR-UV and `uv venv`, for the reasons spelled out on "Conan Build -
  # Windows" above. This job only restores and uploads a cache tarball, so it
  # does not compile against the interpreter -- it still builds the venv on
  # the matrix ABI so both Windows jobs bootstrap identically and neither can
  # be the one that rots.
  image: GLR-UV
  parallel:
    matrix:
      - PYTHON_TARGET_VERSION: '3.13'
  # Depend on the whole build job rather than selecting one parallel instance.
  # GitLab does not expand variables inside needs:parallel:matrix, so a selector
  # like "PYTHON_TARGET_VERSION: $PYTHON_TARGET_VERSION" is compared literally,
  # matches no job, and fails the whole pipeline at config time with
  # "undefined need". Listing the matrix values instead would make every deploy
  # instance need every build instance anyway, so this is equivalent and cannot
  # drift out of sync with the matrix above.
  needs:
    - job: "Conan Build - Windows"
      artifacts: true
  artifacts:
    expire_in: '1d'
    paths:
      - conan_packages/
  script:
    - uv --version
    - uv venv --python ${PYTHON_TARGET_VERSION} .venv
    - source .venv/Scripts/activate
    - uv pip install --upgrade "xmsconan[ci]>=2.18.0,<3" --index-url https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_conan_setup
    - xmsconan_conan_deploy xmssnap --restore .export/xmssnap-windows-py${PYTHON_TARGET_VERSION}-{version}.tar.gz --upload --package-query compiler.version=194
    - mkdir -p conan_packages
    - cp -r ${HOME}/.conan2/p/* conan_packages/ || echo "warning - no Conan packages under ${HOME}/.conan2/p, conan_packages/ artifact will be empty"
  only:
    - tags
  tags:
    - WinVM

"Conan Deploy - Windows VS2019":
  stage: Deploy
  image: GLR-UV
  parallel:
    matrix:
      - PYTHON_TARGET_VERSION: '3.13'
  # The whole build job, not one parallel instance, for the reason given on
  # "Conan Deploy - Windows" above: GitLab does not expand variables inside
  # needs:parallel:matrix.
  needs:
    - job: "Conan Build - Windows VS2019"
      artifacts: true
  script:
    - uv --version
    - uv venv --python ${PYTHON_TARGET_VERSION} .venv
    - source .venv/Scripts/activate
    - uv pip install --upgrade "xmsconan[ci]>=2.18.0,<3" --index-url https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_conan_setup
    - xmsconan_conan_setup --remote-name aquaveo-vs2019 --remote-url https://conan2.aquaveo.com/artifactory/api/conan/aquaveo-vs2019 --append
    - xmsconan_conan_deploy xmssnap --restore .export/xmssnap-windows-vs2019-py${PYTHON_TARGET_VERSION}-{version}.tar.gz --upload --remote aquaveo-vs2019 --package-query compiler.version=192
  only:
    - tags
  tags:
    - WinVM

"Coverage Build":
  stage: Coverage
  needs: []
  except:
    - tags
  image: docker.aquaveo.com/aquaveo/conan-docker/conan-gcc13-x11-gdal-py3.13
  # The resolved coverage ABI, which also names the conan-gcc13 image above --
  # so on those two branches the container interpreter and the ABI the build
  # targets cannot drift apart. Under an explicit [ci].docker_image the image
  # is whatever the repo named and only this pin is resolved, so keeping that
  # image's interpreter in step is the repo's job. xmsconan_coverage exports
  # the same value itself; declaring it here keeps the job readable without
  # tracing into the packager.
  variables:
    PYTHON_TARGET_VERSION: '3.13'
  script:
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_conan_setup
    - export CTEST_PARALLEL_LEVEL=${CTEST_PARALLEL_LEVEL:-8}
    - xmsconan_coverage --phase collect build.toml
  artifacts:
    expire_in: '1d'
    when: always
    paths:
      - cov-cpp.xml
      - cov-cpp-summary.json
      - cov-py.xml
      - cov-py-summary.json
      - coverage-status.json
      - coverage-html-cpp/
      - coverage-html-py/

Coverage:
  stage: Coverage
  needs:
    - job: "Coverage Build"
      artifacts: true
  # Under [ci].split_tests the tests gate the pipeline from the "Run C++ Tests"
  # jobs, so a coverage *gate* miss is advisory here. Only that exit code is
  # forgiven. The tool failing -- an exception, the collect job leaving no
  # summary to read -- still fails the job, because `allow_failure: true`
  # forgave those too, and a Coverage stage reporting green while producing no
  # report at all is how a broken coverage run survived an entire release
  # unnoticed.
  allow_failure:
    exit_codes:
      - 3
  except:
    - tags
  image: python:3.13
  script:
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_coverage --phase report build.toml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cov-cpp.xml
    paths:
      - cov-cpp.xml
      - cov-py.xml
  coverage: '/Coverage total: (\d+\.?\d*%)/'

pages:
  stage: Pages
  dependencies:
    - "Coverage Build"
  script:
    - mkdir -p public
    - cp -r coverage-html-cpp public/cpp
    - HAS_PY=0
    - if [ -d coverage-html-py ]; then cp -r coverage-html-py public/python; HAS_PY=1; fi
    - |
      {
        echo '<!DOCTYPE html>'
        echo '<html lang="en"><head><meta charset="utf-8">'
        echo '<title>xmssnap coverage</title></head><body>'
        echo '<h1>xmssnap coverage</h1>'
        echo '<ul>'
        echo '<li><a href="cpp/index.html">C++ coverage (gcovr)</a></li>'
        [ "$HAS_PY" -eq 1 ] && echo '<li><a href="python/index.html">Python coverage (pytest-cov)</a></li>'
        echo '</ul></body></html>'
      } > public/index.html
  artifacts:
    paths:
      - public
  only:
    - master
    - main
