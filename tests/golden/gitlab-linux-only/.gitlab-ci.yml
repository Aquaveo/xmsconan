# Required CI/CD variables:
#   CONAN_LOGIN_USERNAME - Conan remote login username
#   CONAN_PASSWORD       - Conan remote login password
#
# The Conan pair is listed unconditionally: no job here sets it, Conan reads
# it from the environment itself, and every build needs the remote -- not just
# the tag-time deploy. See docs/USAGE.md §10.2.
#
# Generated by xmsconan_ci — do not edit manually.

stages:
  - Test
  - Package

Conan Build:
  stage: Test
  image: docker.aquaveo.com/aquaveo/conan-docker/conan-gcc13-py3.13
  variables:
    PYTHON_TARGET_VERSION: '3.13'
  artifacts:
    expire_in: '1d'
    when: always
    paths:
      - wheelhouse/
      - test_artifacts/
  script:
    - gcc --version
    - cmake --version
    - python --version
    - pip install "conan~=2.31.0" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - pip install --upgrade "xmsconan>=2.18.0" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_conan_setup
    - export PACKAGE_VERSION=${CI_COMMIT_TAG:-0.0.0}
    - export CTEST_PARALLEL_LEVEL=${CTEST_PARALLEL_LEVEL:-8}
    - xmsconan_gen --version ${PACKAGE_VERSION} build.toml
    - python build.py --version ${PACKAGE_VERSION} --wheel-dir wheelhouse --artifacts-dir test_artifacts

Lint:
  stage: Test
  image: python:3.13
  allow_failure: true
  script:
    - pip install flake8 flake8-docstrings flake8-bugbear flake8-import-order pep8-naming flake8-colors flake8-tidy-imports
    - pip install -i https://aquapi.aquaveo.com/aquaveo/dev/+simple/ flake8-aquaveo
    - pip install --upgrade "xmsconan>=2.18.0" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_gen --version 0.0.0 build.toml
    - flake8 _package

Repair Wheel:
  stage: Package
  image: quay.io/pypa/manylinux_2_28_x86_64
  dependencies:
    - Conan Build
  script:
    - /opt/python/cp313-cp313/bin/pip install --upgrade "xmsconan>=2.18.0" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - /opt/python/cp313-cp313/bin/xmsconan_wheel_repair --wheel-dir wheelhouse
  artifacts:
    expire_in: '1d'
    paths:
      - wheelhouse/


