# Required CI/CD variables:
#   CONAN_LOGIN_USERNAME - Conan remote login username
#   CONAN_PASSWORD       - Conan remote login password
#   AQUAPI_URL           - devpi index URL for wheel uploads
#   AQUAPI_USERNAME      - devpi username for wheel uploads
#   AQUAPI_PASSWORD      - devpi password for wheel uploads
#
# The Conan pair is listed unconditionally: no job here sets it, Conan reads
# it from the environment itself, and every build needs the remote -- not just
# the tag-time deploy. See docs/USAGE.md §10.2.
#
# Every job installs `xmsconan[ci]` from the public Aquaveo index -- the
# extra pins conan, cmake, gcovr and the flake8 plugins in xmsconan's own
# pyproject.toml -- and the tools read the package version from
# CI_COMMIT_TAG themselves (0.0.0 on an untagged pipeline), so no job
# exports a version for the next command. See docs/USAGE.md §10.3.
#
# Generated by xmsconan_ci — do not edit manually.

stages:
  - Test
  - Package
  - Deploy

Conan Build:
  stage: Test
  image: docker.aquaveo.com/aquaveo/conan-docker/conan-gcc13-py3.13
  variables:
    PYTHON_TARGET_VERSION: '3.13'
  artifacts:
    expire_in: '1d'
    when: always
    paths:
      - .export
      - wheelhouse/
      - test_artifacts/
  script:
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan job build --export

"Conan Build - Windows":
  stage: Test
  image: GLR-UV
  parallel:
    matrix:
      - PYTHON_TARGET_VERSION: '3.13'
  variables:
    AQUAPI_URL: "https://aquapi.aquaveo.com/aquaveo/dev"
  artifacts:
    expire_in: '1d'
    when: always
    paths:
      - .export
      - test_artifacts/
      - wheelhouse/*.whl
  script:
    - uv --version
    - uv venv --python ${PYTHON_TARGET_VERSION} .venv
    - source .venv/Scripts/activate
    - uv pip install --upgrade "xmsconan[ci]>=2.18.0,<3" --index-url https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan job build --export
  tags:
    - WinVM

Lint:
  stage: Test
  image: python:3.13
  allow_failure: true
  script:
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - pip install -i https://aquapi.aquaveo.com/aquaveo/dev/+simple/ flake8-aquaveo
    - xmsconan job lint

Repair Wheel:
  stage: Package
  image: quay.io/pypa/manylinux_2_28_x86_64
  dependencies:
    - Conan Build
  script:
    - /opt/python/cp313-cp313/bin/pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - /opt/python/cp313-cp313/bin/xmsconan job package
  artifacts:
    expire_in: '1d'
    paths:
      - wheelhouse/

"Wheel Deploy":
  stage: Deploy
  image: python:3.13
  dependencies:
    - Repair Wheel
  script:
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_wheel_deploy --wheel-dir wheelhouse
  only:
    - tags

"Conan Deploy - Linux":
  stage: Deploy
  image: ubuntu:latest
  dependencies:
    - Conan Build
  script:
    - apt-get update
    - apt-get install -y python3-pip python3-venv
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_conan_setup
    - xmsconan_conan_deploy xmssnap --restore .export/xmssnap-linux-py3.13-{version}.tar.gz --upload
  only:
    - tags

"Wheel Deploy - Windows":
  stage: Deploy
  image: python:3.13
  needs:
    - job: "Conan Build - Windows"
      artifacts: true
  script:
    - pip install --upgrade "xmsconan[ci]>=2.18.0,<3" -i https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_wheel_deploy --wheel-dir wheelhouse
  only:
    - tags

"Conan Deploy - Windows":
  stage: Deploy
  # GLR-UV and `uv venv`, for the reasons spelled out on "Conan Build -
  # Windows" above. This job only restores and uploads a cache tarball, so it
  # does not compile against the interpreter -- it still builds the venv on
  # the matrix ABI so both Windows jobs bootstrap identically and neither can
  # be the one that rots.
  image: GLR-UV
  parallel:
    matrix:
      - PYTHON_TARGET_VERSION: '3.13'
  # Depend on the whole build job rather than selecting one parallel instance.
  # GitLab does not expand variables inside needs:parallel:matrix, so a selector
  # like "PYTHON_TARGET_VERSION: $PYTHON_TARGET_VERSION" is compared literally,
  # matches no job, and fails the whole pipeline at config time with
  # "undefined need". Listing the matrix values instead would make every deploy
  # instance need every build instance anyway, so this is equivalent and cannot
  # drift out of sync with the matrix above.
  needs:
    - job: "Conan Build - Windows"
      artifacts: true
  artifacts:
    expire_in: '1d'
    paths:
      - conan_packages/
  script:
    - uv --version
    - uv venv --python ${PYTHON_TARGET_VERSION} .venv
    - source .venv/Scripts/activate
    - uv pip install --upgrade "xmsconan[ci]>=2.18.0,<3" --index-url https://public.aquapi.aquaveo.com/aquaveo/dev/+simple
    - xmsconan_conan_setup
    - xmsconan_conan_deploy xmssnap --restore .export/xmssnap-windows-py${PYTHON_TARGET_VERSION}-{version}.tar.gz --upload --package-query compiler.version=194
    - mkdir -p conan_packages
    - cp -r ${HOME}/.conan2/p/* conan_packages/ || echo "warning - no Conan packages under ${HOME}/.conan2/p, conan_packages/ artifact will be empty"
  only:
    - tags
  tags:
    - WinVM


